<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Bid Queue · Nellis Deal Engine</title>
<style>
  :root{--bg:#f4f5f7;--card:#fff;--ink:#1a1d21;--muted:#6b7684;--line:#e3e6ea;
        --navy:#12253d;--green:#0d3b2e;--accent:#1a7f5a;--bad:#b3261e}
  @media (prefers-color-scheme:dark){
    :root{--bg:#12151a;--card:#1a1f27;--ink:#e8ebef;--muted:#9aa4b2;--line:#2a3038}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:14px/1.5 -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
  header{background:var(--navy);color:#fff;padding:13px 20px;display:flex;
    align-items:center;gap:16px;flex-wrap:wrap}
  header h1{font-size:15px;margin:0}
  .exp{margin-left:auto;font-size:12px;color:#9fb3cc}
  .exp b{color:#fff}
  main{max-width:820px;margin:0 auto;padding:18px 14px 50px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;
    padding:14px;margin-bottom:11px;display:flex;gap:14px;align-items:flex-start}
  .grow{flex:1;min-width:0}
  .t{font-weight:650;font-size:14px;margin-bottom:3px}
  .m{font-size:12px;color:var(--muted)}
  .bid{background:var(--green);color:#fff;border-radius:8px;padding:9px 12px;
    text-align:right;min-width:132px}
  .bid .l{font-size:9px;text-transform:uppercase;letter-spacing:.8px;color:#7fd1b0;font-weight:800}
  .bid .a{font-size:22px;font-weight:800;line-height:1.15}
  .bid .s{font-size:10.5px;color:#a7c9bd}
  .tag{display:inline-block;padding:1px 7px;border-radius:9px;font-size:9.5px;
    font-weight:800;text-transform:uppercase}
  .tag.high{background:#dcf5e7;color:#12653f}
  .tag.medium{background:#fdf0d5;color:#7a5406}
  .tag.low,.tag.none{background:#fbe0e0;color:#8f2020}
  button{border:0;border-radius:7px;padding:7px 13px;font-size:12.5px;
    font-weight:650;cursor:pointer;font-family:inherit;background:var(--navy);color:#fff}
  button.ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}
  .acts{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap}
  .empty{text-align:center;color:var(--muted);padding:40px 20px}
  .banner{background:#fff8e6;border:1px solid #f0dfae;color:#6b5416;
    border-radius:8px;padding:10px 12px;font-size:12.5px;margin-bottom:14px}
  .bar{height:5px;background:rgba(255,255,255,.2);border-radius:3px;margin-top:4px;width:170px}
  .bar span{display:block;height:100%;background:#7fd1b0;border-radius:3px}
</style>
</head>
<body>
<header>
  <h1>Bid Queue</h1>
  <span id="count" class="m" style="color:#9fb3cc"></span>
  <div class="exp" id="exposure"></div>
</header>
<main>
  <div class="banner">
    Work top to bottom. <b>Open</b> puts the lot in a new tab with your max bid
    already filled in &mdash; you click Place Bid there, then come back and mark it placed.
    Nothing here bids for you.
  </div>
  <div id="list"></div>
</main>
<script src="queue.js"></script>
</body>
</html>
